{% set name = "py-rattler-build" %}
{% set version = "0.58.4" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name.replace('-','_') }}-{{ version }}.tar.gz
  sha256: 1195cafb72a5de02186c73f6b4cfbae1386aa7a26c9d90769a1987bd222b48d8

build:
  number: 0

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
  host:
    - pip
    - python
    - maturin >=1.2.1,<2
    - openssl {{ openssl }}  # [unix]
  run:
    - python

test:
  imports:
    - rattler_build
  requires:
    - pip
  commands:
    - pip check

about:
  home: http://rattler.build/
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: The fastest way to build conda packages programatically
  description: |
    The `rattler-build` tooling and library creates cross-platform relocatable
    binaries / packages from a simple recipe format. The recipe format is heavily
    inspired by `conda-build` and `boa`, and the output of a regular `rattler-build`
    run is a package that can be installed using `mamba`, `rattler` or `conda`.
  dev_url: https://github.com/prefix-dev/rattler-build
  doc_url: https://rattler.build/latest/reference/python_bindings/

extra:
  feedstock-name: py-rattler-build
  recipe-maintainers:
    - baszalmstra
    - pavelzw