{% set name = "py-rattler-build" %}
{% set version = "0.76.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  # 0.76.1 is not on PyPI (latest sdist is 0.73.0). The Python crate lives in
  # the rattler-build monorepo and path-depends on the workspace root.
  url: https://github.com/prefix-dev/rattler-build/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 2caad9c21e3293b04ff007f883ab42f465c8e619b230baffcd2a9d88a0979071

build:
  number: 0

requirements:
  build:
    - {{ stdlib("c") }}
    - {{ compiler('c') }}
    - {{ compiler('rust') }}
    - cargo-bundle-licenses
    - cmake
    - clang  # [win and arm64]
    - lld  # [win and arm64]
    - make  # [unix]
  host:
    - pip
    - python
    # upstream pyproject.toml: maturin~=1.14.1
    - maturin >=1.14.1,<1.15
    # linux native-tls links pkgs/main openssl. osx uses rustls (no openssl).
    - openssl {{ openssl }}  # [linux]
  run:
    - python
    # lockstep with the CLI; 0.76.1 is not on pkgs/main yet — staging in abs.yaml
    - rattler-build {{ version }}.*

test:
  imports:
    - rattler_build
    - rattler_build._rattler_build
  requires:
    - pip
  commands:
    - pip check
    - python -c "from rattler_build import rattler_build_version; assert rattler_build_version()"

about:
  home: https://rattler.build
  license: BSD-3-Clause
  license_family: BSD
  license_file:
    - LICENSE
    - THIRDPARTY.yml
  summary: The fastest way to build conda packages programatically
  description: |
    The `rattler-build` tooling and library creates cross-platform relocatable
    binaries / packages from a simple recipe format. The recipe format is heavily
    inspired by `conda-build` and `boa`, and the output of a regular `rattler-build`
    run is a package that can be installed using `mamba`, `rattler` or `conda`.
  dev_url: https://github.com/prefix-dev/rattler-build
  doc_url: https://rattler.build/latest/py-rattler-build/reference

extra:
  feedstock-name: py-rattler-build
  recipe-maintainers:
    - baszalmstra
    - pavelzw
